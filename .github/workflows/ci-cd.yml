name: Tradexy CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ════════════════════════════════════════
  # JOB 1: TEST
  # ════════════════════════════════════════
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, zip, exif, pcntl
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: 📄 Copy environment file
        run: cp .env.example .env

      - name: 🔑 Generate application key
        run: php artisan key:generate

      - name: 🗄️ Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing_db
          DB_USERNAME: postgres
          DB_PASSWORD: password

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: 🔨 Build Vite assets
        run: npm run build

      - name: 🧪 Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing_db
          DB_USERNAME: postgres
          DB_PASSWORD: password

  # ════════════════════════════════════════
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ════════════════════════════════════════
  build:
    name: 🐳 Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: 🔨 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ════════════════════════════════════════
  # JOB 3: DEPLOY TO DEV
  # ════════════════════════════════════════
  deploy-dev:
    name: 🚀 Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Sync config files to server
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: "docker-compose.dev.yml,docker/nginx/default.conf"
          target: /var/www/tradexy-dev

      - name: 🖥️ Deploy to Dev Server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          envs: GH_PAT,GH_ACTOR,GH_REPO
          script: |
            set -e
            echo "========================================="
            echo "🚀 Deploying to DEV"
            echo "========================================="
            cd /var/www/tradexy-dev

            if [ ! -f .env ]; then
              echo "❌ No .env file found!"
              exit 1
            fi

            echo "${GH_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            docker pull ghcr.io/${GH_REPO}:dev

            docker rm -f tradexy_scheduler_dev || true
            docker-compose -f docker-compose.dev.yml down --remove-orphans
            docker-compose -f docker-compose.dev.yml up -d --remove-orphans
            sleep 15

            docker-compose -f docker-compose.dev.yml exec -T app php artisan migrate --force
            docker-compose -f docker-compose.dev.yml exec -T app php artisan storage:link || true
            docker-compose -f docker-compose.dev.yml exec -T app php artisan optimize
            docker-compose -f docker-compose.dev.yml exec -T app php artisan queue:restart
            docker-compose -f docker-compose.dev.yml exec -T app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            docker image prune -af
            docker logout ghcr.io

            echo "✅ Dev deployment complete!"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}

  # ════════════════════════════════════════
  # JOB 4: DEPLOY TO STAGING
  # ════════════════════════════════════════
  deploy-staging:
    name: 🟡 Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Sync config files to server
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: "docker-compose.staging.yml,docker/nginx/default.conf"
          target: /var/www/tradexy-staging

      - name: 🖥️ Deploy to Staging Server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          envs: GH_PAT,GH_ACTOR,GH_REPO
          script: |
            set -e
            echo "========================================="
            echo "🟡 Deploying to STAGING"
            echo "========================================="
            cd /var/www/tradexy-staging

            if [ ! -f .env ]; then
              echo "❌ No .env file found!"
              exit 1
            fi

            echo "${GH_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            docker pull ghcr.io/${GH_REPO}:staging

            docker rm -f tradexy_scheduler_staging || true
            docker-compose -f docker-compose.staging.yml down --remove-orphans
            docker-compose -f docker-compose.staging.yml up -d --remove-orphans
            sleep 15

            docker-compose -f docker-compose.staging.yml exec -T app php artisan migrate --force
            docker-compose -f docker-compose.staging.yml exec -T app php artisan storage:link || true
            docker-compose -f docker-compose.staging.yml exec -T app php artisan optimize
            docker-compose -f docker-compose.staging.yml exec -T app php artisan queue:restart
            docker-compose -f docker-compose.staging.yml exec -T app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            docker image prune -af
            docker logout ghcr.io

            echo "✅ Staging deployment complete!"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}

  # ════════════════════════════════════════
  # JOB 5: DEPLOY TO PRODUCTION
  # ════════════════════════════════════════
  deploy-production:
    name: 🟢 Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Sync config files to server
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: "docker-compose.prod.yml,docker/nginx/default.conf"
          target: /var/www/tradexy-prod

      - name: 🖥️ Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          envs: GH_PAT,GH_ACTOR,GH_REPO
          script: |
            set -e
            echo "========================================="
            echo "🟢 Deploying to PRODUCTION"
            echo "========================================="
            cd /var/www/tradexy-prod

            if [ ! -f .env ]; then
              echo "❌ No .env file found!"
              exit 1
            fi

            echo "${GH_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            docker pull ghcr.io/${GH_REPO}:main

            docker rm -f tradexy_scheduler_prod || true
            docker-compose -f docker-compose.prod.yml down --remove-orphans
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 15

            docker-compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker-compose -f docker-compose.prod.yml exec -T app php artisan storage:link || true
            docker-compose -f docker-compose.prod.yml exec -T app php artisan optimize
            docker-compose -f docker-compose.prod.yml exec -T app php artisan queue:restart
            docker-compose -f docker-compose.prod.yml exec -T app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            docker image prune -af
            docker logout ghcr.io

            echo "✅ Production deployment complete!"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}