services:
  app:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_app_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    volumes:
      - app_storage_prod:/var/www/storage
      - app_public_prod:/var/www/public-shared
      - ./tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json:/var/www/storage/app/private/tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json
    depends_on:
      - redis
    networks:
      - tradexy_prod

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - app_public_prod:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradexy_prod

  scheduler:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
      # Broadcast directly to Reverb container over internal Docker network (avoids TLS)
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - app_storage_prod:/var/www/storage
      - ./tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json:/var/www/storage/app/private/tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json
    depends_on:
      - app
      - reverb
      - redis
    networks:
      - tradexy_prod
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  queue:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_queue_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
      # Broadcast directly to Reverb container over internal Docker network (avoids TLS)
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - app_storage_prod:/var/www/storage
      - ./tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json:/var/www/storage/app/private/tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json
    depends_on:
      - app
      - reverb
      - redis
    networks:
      - tradexy_prod
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  reverb:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_reverb_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      - app
      - redis
    networks:
      - tradexy_prod
    command: php artisan reverb:start --host="0.0.0.0" --port=8080

  redis:
    image: redis:alpine
    container_name: tradexy_redis_prod
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data_prod:/data
    networks:
      - tradexy_prod

networks:
  tradexy_prod:

volumes:
  app_storage_prod:
  app_public_prod:
  redis_data_prod: