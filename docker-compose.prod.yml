services:
  app:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_app_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    volumes:
      - app_storage_prod:/var/www/storage
    networks:
      - tradexy_prod

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_prod
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - app_storage_prod:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradexy_prod

networks:
  tradexy_prod:

volumes:
  app_storage_prod: