services:
  app:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_app_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    volumes:
      - app_storage_prod:/var/www/storage
      - app_public_prod:/var/www/public-shared
    networks:
      - tradexy_prod

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - app_public_prod:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradexy_prod

  scheduler:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    volumes:
      - app_storage_prod:/var/www/storage
    depends_on:
      - app
    networks:
      - tradexy_prod
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  queue:
    image: ghcr.io/codebykenth/trading-journal-v2:main
    container_name: tradexy_queue_prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    volumes:
      - app_storage_prod:/var/www/storage
    depends_on:
      - app
    networks:
      - tradexy_prod
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

networks:
  tradexy_prod:

volumes:
  app_storage_prod:
  app_public_prod: