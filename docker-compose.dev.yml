services:
  app:
    image: ghcr.io/codebykenth/trading-journal-v2:dev
    container_name: tradexy_app_dev
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    volumes:
      - app_storage_dev:/var/www/storage
      - app_public_dev:/var/www/public-shared
    networks:
      - tradexy_dev

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app_public_dev:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradexy_dev

  queue:
    image: ghcr.io/codebykenth/trading-journal-v2:dev
    container_name: tradexy_queue_dev
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    volumes:
      - app_storage_dev:/var/www/storage
    depends_on:
      - app
    networks:
      - tradexy_dev
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

networks:
  tradexy_dev:

volumes:
  app_storage_dev:
  app_public_dev: