services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tradexy_app_dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - tradexy_dev

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tradexy_dev

networks:
  tradexy_dev: