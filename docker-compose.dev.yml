services:
  app:
    image: ghcr.io/codebykenth/trading-journal-v2:dev
    container_name: tradexy_app_dev
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    volumes:
      - app_storage_dev:/var/www/storage
      - app_public_dev:/var/www/public-shared
      - ./tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json:/var/www/storage/app/private/tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json
    networks:
      - tradexy_dev

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app_public_dev:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradexy_dev

  queue:
    image: ghcr.io/codebykenth/trading-journal-v2:dev
    container_name: tradexy_queue_dev
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
      # Broadcast directly to Reverb container over internal Docker network (avoids TLS)
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - app_storage_dev:/var/www/storage
      - ./tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json:/var/www/storage/app/private/tradexy-47021-firebase-adminsdk-fbsvc-f8bf8180f3.json
    depends_on:
      - app
      - reverb
    networks:
      - tradexy_dev
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  reverb:
    image: ghcr.io/codebykenth/trading-journal-v2:dev
    container_name: tradexy_reverb_dev
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      - TZ=Asia/Manila
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      - app
    networks:
      - tradexy_dev
    command: php artisan reverb:start --host="0.0.0.0" --port=8080

networks:
  tradexy_dev:

volumes:
  app_storage_dev:
  app_public_dev: