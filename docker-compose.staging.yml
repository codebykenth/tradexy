services:
  app:
    image: ghcr.io/codebykenth/trading-journal-v2:staging
    container_name: tradexy_app_staging
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    volumes:
      - app_storage_staging:/var/www/storage
      - app_public_staging:/var/www/public-shared
    networks:
      - tradexy_staging

  nginx:
    image: nginx:alpine
    container_name: tradexy_nginx_staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - app_public_staging:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradexy_staging

networks:
  tradexy_staging:

volumes:
  app_storage_staging:
  app_public_staging: